<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/promilloPWA/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Estimate your blood alcohol concentration (Promille), log drinks and see when you'll be sober again.">
  <meta name="theme-color" content="#673AB7">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="promillo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>promillo</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // iOS/iPadOS (Safari + Home-Bildschirm-PWA): Beim Aufklappen der Tastatur
    // schiebt Safari die ganze Seite nach oben, um Flutters unsichtbares
    // Eingabefeld sichtbar zu machen. Flutter weicht der Tastatur aber selbst
    // schon aus (viewInsets) – zusammen ergibt das eine doppelte Verschiebung,
    // Dialoge rutschen unter die Statusleiste. Eine Flutter-Seite scrollt als
    // Dokument nie, also wird die Browser-Verschiebung sofort zurückgesetzt.
    // Android/Chrome verhält sich korrekt und bleibt unberührt.
    (function () {
      var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (!isIOS) return;
      var vv = window.visualViewport;
      function reset() {
        if (window.scrollX !== 0 || window.scrollY !== 0 ||
            (vv && vv.offsetTop !== 0)) {
          window.scrollTo(0, 0);
        }
      }
      window.addEventListener('scroll', reset, { passive: true });
      if (vv) {
        vv.addEventListener('scroll', reset);
        vv.addEventListener('resize', reset);
      }
      document.addEventListener('focusout', function () {
        setTimeout(reset, 50);
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
